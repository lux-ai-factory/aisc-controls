# Out of date, and not used by the aisc stack. The stack defines controls-pdf,
# controls-migrate and controls-web in the aisc repo's own
# docker-compose.development.yml; use that (see README.md). This fragment still
# migrates and seeds one shared database, which the app no longer has: each
# project has a database of its own.
#
# Build contexts are relative to the aisc repo root (the directory of the first
# -f file), so this assumes the repo is mounted at apps/controls.

services:
  # PDF report renderer sidecar. Internal-only; reached as http://controls-pdf:8005.
  controls-pdf:
    build: apps/controls/services/pdf_renderer
    # Explicit name (like the platform's other services) so it never collides
    # with the standalone stack's auto-named aisc-controls-pdf-1 container.
    container_name: controls-pdf
    restart: unless-stopped
    networks: [backend]

  # One-shot: migrate and seed, then exit; retried until Postgres accepts
  # connections.
  controls-migrate:
    build: apps/controls
    container_name: controls-migrate
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[controls] waiting for postgres…'; sleep 2; done && npx prisma db seed"
    env_file: apps/controls/env.development
    depends_on: [postgres] # shared infra Postgres (docker-compose-infra.*.yml)
    restart: "no"
    networks: [backend]

  controls-web:
    build:
      context: apps/controls
      args:
        # CONTROLS_BASE_PATH=/controls serves the app under /controls behind Caddy.
        NEXT_BASE_PATH: ${CONTROLS_BASE_PATH:-}
    container_name: controls-web
    env_file: apps/controls/env.development
    depends_on:
      controls-migrate:
        condition: service_completed_successfully
      controls-pdf:
        condition: service_started
    ports:
      # Direct access, besides Caddy. 3100 by default, clear of the webapp.
      - "${CONTROLS_WEB_PORT:-3100}:3000"
    restart: unless-stopped
    networks: [backend, frontend]

# Declared here too so the fragment is valid; merged with the infra file's
# networks of the same name (one shared project network each).
networks:
  backend:
  frontend:
